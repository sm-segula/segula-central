# Rebuilds the site every morning so new content appears without a code change:
# a Gazzette published on Heyzine (titled "Gazzette <Mes> <Año>", read with
# HEYZINE_API_KEY) and a new "¿Sabías qué?" image in its Drive folder (listed by
# the Apps Script action sabias_list). "Run workflow" publishes it now.
name: Daily content rebuild

on:
  schedule:
    - cron: "0 13 * * *" # 07:00 America/Mexico_City
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Vercel production deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Missing repository secret VERCEL_DEPLOY_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Deploy requested."
